# App-wide fields. app, namespace, image, and workloads are required.
app: ""
namespace: ""
image: ""
imagePullSecret: ""
serviceAccount: ""
nodeSelector: {}
envFrom:
  configMaps: []
  secrets: []
prometheus:
  serverAddress: ""

# The paved road. Workloads override these per field; apps rarely touch this block.
defaults:
  resources:
    requests: { cpu: 1000m, memory: 2Gi }
    limits: { cpu: 2000m, memory: 4Gi }
  vpa:
    updateMode: "Off"
    min: { cpu: 500m, memory: 1Gi }
    max: { cpu: 4000m, memory: 8Gi }
  pdb: { maxUnavailable: 1 }
  strategy: { maxSurge: 25%, maxUnavailable: 0 }
  scaleDownStabilizationSeconds: 300
  cron:
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  hook:
    activeDeadlineSeconds: 1800
    deletePolicy: BeforeHookCreation
    backoffLimit: 0

# Map keyed by workload name, so an env values file can override one workload.
workloads: {}
