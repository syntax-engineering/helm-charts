{{- include "sw.assertUniqueGateways" . }}
{{- range $name, $w := .Values.workloads }}
{{- if and (eq $w.kind "Web") (ne $w.enabled false) }}
{{- range $key, $in := $w.ingress }}
{{- if and (eq $in.backend "ngf") (ne $in.enabled false) }}
{{- $c := dict "root" $ "name" $name "w" $w "key" $key "in" $in }}
{{- $gw := $in.gateway | default dict }}
{{- $gwName := include "sw.ngfGatewayName" $c }}
{{- $gwNamespace := include "sw.ngfGatewayNamespace" $c }}
{{- if ne $gw.create false }}
{{- $issuer := dict "cert-manager.io/cluster-issuer" (dig "tls" "clusterIssuer" "" $in) }}
{{- if not (dig "tls" "clusterIssuer" "" $in) }}
{{- $issuer = dict "cert-manager.io/issuer" (printf "%s-acme" $gwName) }}
{{- /* The solver attaches the challenge route to this Gateway; without parentRefs it attaches nowhere. */}}
{{- $parent := dict "group" "gateway.networking.k8s.io" "kind" "Gateway" "name" $gwName "namespace" $gwNamespace }}
---
{{ include "sw.acmeIssuer" (dict "c" $c "name" (printf "%s-acme" $gwName) "namespace" $gwNamespace "solver" (dict "http01" (dict "gatewayHTTPRoute" (dict "parentRefs" (list $parent))))) }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  namespace: {{ $gwNamespace }}
  labels: {{- include "sw.selector" $c | nindent 4 }}
  annotations: {{- toYaml (merge $issuer ($gw.annotations | default dict)) | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className | default "nginx" }}
  listeners:
    {{- range $in.hostnames }}
    {{- /* cert-manager creates the challenge route in the Gateway's namespace, so port 80 accepts routes from there too. */}}
    - name: http-{{ include "sw.hostLabel" . }}
      hostname: {{ . | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector: { matchExpressions: [{ key: kubernetes.io/metadata.name, operator: In, values: [{{ $.Values.namespace }}, {{ $gwNamespace }}] }] }
    - name: https-{{ include "sw.hostLabel" . }}
      hostname: {{ . | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { group: '', kind: Secret, name: {{ include "sw.ingressTlsSecret" $c }} }
      allowedRoutes:
        namespaces:
          from: Selector
          selector: { matchLabels: { kubernetes.io/metadata.name: {{ $.Values.namespace }} } }
    {{- end }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sw.ingressName" $c }}
  namespace: {{ $.Values.namespace }}
  labels: {{- include "sw.selector" $c | nindent 4 }}
  {{- with $in.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $in.hostnames }}
    - { group: gateway.networking.k8s.io, kind: Gateway, name: {{ $gwName }}, namespace: {{ $gwNamespace }}, sectionName: https-{{ include "sw.hostLabel" . }} }
    {{- end }}
  hostnames: {{- toYaml $in.hostnames | nindent 4 }}
  rules:
    {{- range $rule := prepend ($in.paths | default list) (dict "prefix" "/" "service" (include "sw.ingressService" $c) "port" $w.port) }}
    - matches:
        - path: { type: PathPrefix, value: {{ $rule.prefix }} }
      {{- with $in.responseHeaders }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              {{- range $header, $value := . }}
              - { name: {{ $header }}, value: {{ $value | quote }} }
              {{- end }}
      {{- end }}
      backendRefs:
        - { group: '', kind: Service, name: {{ $rule.service }}, port: {{ $rule.port }} }
    {{- end }}
{{- if ne $in.redirectHttp false }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sw.ingressName" $c }}-redirect
  namespace: {{ $.Values.namespace }}
  labels: {{- include "sw.selector" $c | nindent 4 }}
  {{- with $in.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $in.hostnames }}
    - { group: gateway.networking.k8s.io, kind: Gateway, name: {{ $gwName }}, namespace: {{ $gwNamespace }}, sectionName: http-{{ include "sw.hostLabel" . }} }
    {{- end }}
  hostnames: {{- toYaml $in.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: {{ $in.redirectStatusCode | default 301 }} }
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
