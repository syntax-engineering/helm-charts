{{- include "sw.assertUniqueSelectors" . }}
{{- range $name, $w := .Values.workloads }}
{{- if and (has $w.kind (list "Web" "Worker")) (ne $w.enabled false) }}
{{- $c := dict "root" $ "name" $name "w" $w }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sw.fullname" $c }}
  namespace: {{ $.Values.namespace }}
  labels: {{- include "sw.selector" $c | nindent 4 }}
spec:
  {{- if kindIs "map" $w.replicas }}
  {{- with $w.replicas.pinned }}
  replicas: {{ . }}
  {{- end }}
  {{- else }}
  replicas: {{ $w.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "sw.selector" $c | nindent 6 }}
  {{- if not (include "sw.isOff" $w.strategy) }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {{- toYaml (mergeOverwrite (deepCopy $.Values.defaults.strategy) ($w.strategy | default dict)) | nindent 6 }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "sw.selector" $c | nindent 8 }}
    spec:
      {{- include "sw.podSpec" $c | nindent 6 }}
      {{- if ne $w.spread false }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: {{- include "sw.selector" $c | nindent 14 }}
      {{- end }}
{{- end }}
{{- end }}
