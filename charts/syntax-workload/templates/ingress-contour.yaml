{{- include "sw.assertUniqueIngressNames" (dict "root" . "backend" "contour") }}
{{- range $name, $w := .Values.workloads }}
{{- if and (eq $w.kind "Web") (ne $w.enabled false) }}
{{- range $key, $in := $w.ingress }}
{{- if and (eq $in.backend "contour") (ne $in.enabled false) }}
{{- $c := dict "root" $ "name" $name "w" $w "key" $key "in" $in }}
{{- $issuerRef := dict "kind" "ClusterIssuer" "name" (dig "tls" "clusterIssuer" "" $in) }}
{{- if not $issuerRef.name }}
{{- $issuerRef = dict "kind" "Issuer" "name" (printf "%s-acme" (include "sw.ingressName" $c)) }}
{{- /* The solver's challenge Ingress uses the entry's class, so the same Contour serves it. */}}
---
{{ include "sw.acmeIssuer" (dict "c" $c "name" $issuerRef.name "namespace" $.Values.namespace "solver" (dict "http01" (dict "ingress" (dict "ingressClassName" ($in.className | default "contour"))))) }}
{{- end }}
{{- /* HTTPProxy has no cert-manager shim, so the chart asks for the certificate itself. */}}
{{- $perHost := dig "tls" "perHost" false $in }}
{{- $secretNames := dig "tls" "secretNames" (dict) $in }}
{{- $seen := dict }}
{{- range $host, $_ := $secretNames }}
{{- if not (has $host $in.hostnames) }}
{{- fail (printf "contour entry %s/%s: tls.secretNames has %s, which is not in hostnames" $name $key $host) }}
{{- end }}
{{- end }}
{{- if not $perHost }}
---
{{ include "sw.contourCertificate" (dict "c" $c "name" (include "sw.ingressName" $c) "secretName" (include "sw.ingressTlsSecret" $c) "issuerRef" $issuerRef "dnsNames" $in.hostnames) }}
{{- end }}
{{- /* protocol describes the workload's Service, so path rules to other Services leave it out. */}}
{{- $routes := prepend ($in.paths | default list) (dict "prefix" "/" "service" (include "sw.ingressService" $c) "port" $w.port "protocol" $in.protocol) }}
{{- /* An HTTPProxy serves one fqdn, so each hostname gets its own. */}}
{{- range $host := $in.hostnames }}
{{- $objName := include "sw.ingressName" $c }}
{{- if gt (len $in.hostnames) 1 }}{{ $objName = printf "%s-%s" $objName (include "sw.hostLabel" .) }}{{ end }}
{{- $secret := include "sw.ingressTlsSecret" $c }}
{{- if $perHost }}
{{- $secret = get $secretNames . | default (printf "%s-tls" $objName) }}
{{- with get $seen $secret }}
{{- fail (printf "contour entry %s/%s: hostnames %s and %s would both write TLS secret %s; set tls.secretNames for one of them" $name $key . $host $secret) }}
{{- end }}
{{- $_ := set $seen $secret . }}
---
{{ include "sw.contourCertificate" (dict "c" $c "name" $objName "secretName" $secret "issuerRef" $issuerRef "dnsNames" (list .)) }}
{{- end }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $objName }}
  namespace: {{ $.Values.namespace }}
  labels: {{- include "sw.selector" $c | nindent 4 }}
  {{- with $in.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $in.className }}
  ingressClassName: {{ . }}
  {{- end }}
  virtualhost:
    fqdn: {{ . | quote }}
    tls: { secretName: {{ $secret }} }
    {{- with $in.corsPolicy }}
    corsPolicy: {{- toYaml . | nindent 6 }}
    {{- end }}
  routes:
    {{- range $route := $routes }}
    - conditions: [{ prefix: {{ $route.prefix }} }]
      services:
        - name: {{ $route.service }}
          port: {{ $route.port }}
          {{- with $route.protocol }}
          protocol: {{ . }}
          {{- end }}
          {{- with $in.responseHeaders }}
          responseHeadersPolicy:
            set:
              {{- range $header, $value := . }}
              - { name: {{ $header }}, value: {{ $value | quote }} }
              {{- end }}
          {{- end }}
      {{- with $in.timeout }}
      timeoutPolicy: { response: {{ . }}, idle: {{ . }} }
      {{- end }}
      {{- with $in.loadBalancerPolicy }}
      loadBalancerPolicy: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
