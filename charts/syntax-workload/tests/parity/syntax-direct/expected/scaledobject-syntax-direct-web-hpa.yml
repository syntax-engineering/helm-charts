---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: syntax-direct-web-hpa
  namespace: syntax-direct-rebuild
spec:
  cooldownPeriod: 600
  fallback:
    failureThreshold: 3
    replicas: 3
  maxReplicaCount: 5
  minReplicaCount: 1
  scaleTargetRef:
    name: syntax-direct-web
  triggers:
    - metadata:
        query: sum(rate(http_requests_total{path!~"(/healthz|/metrics|/ahoy/events|/users/sign_in/metrics|/|/events)$"}[1m]))
        serverAddress: http://kube-prometheus-stack-synt-prometheus.kube-prometheus-stack:9090
        threshold: "2.00"
      name: http_requests_rate
      type: prometheus
