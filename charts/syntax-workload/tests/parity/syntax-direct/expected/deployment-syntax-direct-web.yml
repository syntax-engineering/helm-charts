---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: syntax-direct
    role: web
  name: syntax-direct-web
  namespace: syntax-direct-rebuild
spec:
  replicas: 2
  selector:
    matchLabels:
      app: syntax-direct
      role: web
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: syntax-direct
        role: web
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: syntax-direct-config
            - secretRef:
                name: syntax-direct-secrets
            - secretRef:
                name: syntax-direct-terraform-secrets
          image: ghcr.io/syntax-engineering/syntax_direct_rebuild:20261007183825
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
          name: syntax-direct-web
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 1
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
      imagePullSecrets:
        - name: syntax-direct-registry-secret
      nodeSelector:
        service: index-engine
      serviceAccountName: syntax-direct-sa
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: syntax-direct
              role: web
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
