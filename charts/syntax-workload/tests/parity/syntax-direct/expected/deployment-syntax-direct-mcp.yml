---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: syntax-direct
    role: mcp
  name: syntax-direct-mcp
  namespace: syntax-direct-rebuild
spec:
  replicas: 4
  selector:
    matchLabels:
      app: syntax-direct
      role: mcp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: syntax-direct
        role: mcp
    spec:
      containers:
        - command:
            - bundle
            - exec
            - saidee-mcp-server
          envFrom:
            - configMapRef:
                name: syntax-direct-config
            - secretRef:
                name: syntax-direct-secrets
            - secretRef:
                name: syntax-direct-terraform-secrets
          image: ghcr.io/syntax-engineering/syntax_direct_rebuild:20261007183825
          livenessProbe:
            failureThreshold: 6
            periodSeconds: 10
            tcpSocket:
              port: mcp
            timeoutSeconds: 5
          name: syntax-direct-mcp
          ports:
            - containerPort: 9393
              name: mcp
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: mcp
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            failureThreshold: 60
            periodSeconds: 5
            tcpSocket:
              port: mcp
            timeoutSeconds: 3
      imagePullSecrets:
        - name: syntax-direct-registry-secret
      nodeSelector:
        service: index-engine
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: syntax-direct
              role: mcp
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
