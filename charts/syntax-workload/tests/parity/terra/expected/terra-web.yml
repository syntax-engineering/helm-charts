apiVersion: apps/v1
kind: Deployment
metadata:
  name: terra-web
  namespace: terra-env
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terra
      role: web
  template:
    metadata:
      labels:
        app: terra
        role: web
    spec:
      # Spread this role across nodes so one node loss (usually a DOKS auto-upgrade
      # drain) cannot take out the whole role. Soft, so pods still schedule when the
      # cluster cannot spread them; matchLabelKeys keeps rolling updates from measuring
      # skew against the outgoing ReplicaSet.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: terra
              role: web
      imagePullSecrets:
        - name: terra-registry-secret
      containers:
        - name: terra-web
          image: ghcr.io/syntax-engineering/terra:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: terra-app-secrets
            - secretRef:
                name: terra-terraform-secrets
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 1000m
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired