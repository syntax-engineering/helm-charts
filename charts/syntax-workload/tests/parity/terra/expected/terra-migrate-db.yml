apiVersion: batch/v1
kind: Job
metadata:
  name: terra-migrate-db
  namespace: terra-env
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: terra-registry-secret
      containers:
        - name: migrate
          image: ghcr.io/syntax-engineering/terra:latest
          command: ["bundle", "exec", "rake", "db:migrate"]
          envFrom:
            - secretRef:
                name: terra-app-secrets
            - secretRef:
                name: terra-terraform-secrets
