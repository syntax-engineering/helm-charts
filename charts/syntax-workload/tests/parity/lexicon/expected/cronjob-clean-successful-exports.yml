---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clean-successful-exports
  namespace: lexicon-prod
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: lexicon
            role: cron-job
        spec:
          containers:
            - command:
                - bundle
                - exec
                - rake
                - operation:clean_success_exports
              envFrom:
                - configMapRef:
                    name: lexicon-config
                - secretRef:
                    name: lexicon-secrets
              image: ghcr.io/syntax-engineering/lexicon_prod:20260911223944
              name: lexicon-cron-job-clean-successful-exports
          imagePullSecrets:
            - name: lexicon-registry-secret
          priorityClassName: lexicon-batch
          restartPolicy: Never
  schedule: 0 4 * * *
