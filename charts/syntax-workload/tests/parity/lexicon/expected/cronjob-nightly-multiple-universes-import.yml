---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-multiple-universes-import
  namespace: lexicon-prod
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: lexicon
            role: cron-job
        spec:
          containers:
            - command:
                - lc
                - universe
                - import_multiple_universes
              envFrom:
                - configMapRef:
                    name: lexicon-config
                - secretRef:
                    name: lexicon-secrets
              image: ghcr.io/syntax-engineering/lexicon_prod:20260911223944
              name: lexicon-cron-job-nightly-multiple-universes-import
          imagePullSecrets:
            - name: lexicon-registry-secret
          priorityClassName: lexicon-batch
          restartPolicy: Never
  schedule: 0 2 * * *
