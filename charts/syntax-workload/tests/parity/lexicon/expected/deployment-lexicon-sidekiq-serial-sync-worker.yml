---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lexicon
    priority: serial_sync
    role: worker
  name: lexicon-sidekiq-serial-sync-worker
  namespace: lexicon-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lexicon
      priority: serial_sync
      role: worker
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lexicon
        priority: serial_sync
        role: worker
    spec:
      containers:
        - command:
            - bundle
            - exec
            - sidekiq
            - -q
            - serial_sync
            - -c
            - "1"
          envFrom:
            - configMapRef:
                name: lexicon-config
            - secretRef:
                name: lexicon-secrets
          image: ghcr.io/syntax-engineering/lexicon_prod:20260911223944
          name: lexicon-sidekiq-serial-sync-worker
          resources:
            limits:
              cpu: 1381m
              memory: 2048Mi
            requests:
              cpu: 250m
              memory: 512Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
      imagePullSecrets:
        - name: lexicon-registry-secret
      priorityClassName: lexicon-batch
      serviceAccountName: lexicon-sidekiq-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: lexicon
              priority: serial_sync
              role: worker
