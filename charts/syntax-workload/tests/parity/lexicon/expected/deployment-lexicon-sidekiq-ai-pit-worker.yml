---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lexicon
    priority: ai_pit
    role: worker
  name: lexicon-sidekiq-ai-pit-worker
  namespace: lexicon-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lexicon
      priority: ai_pit
      role: worker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lexicon
        priority: ai_pit
        role: worker
    spec:
      containers:
        - command:
            - bundle
            - exec
            - sidekiq
            - -q
            - ai_pit
          envFrom:
            - configMapRef:
                name: lexicon-config
            - secretRef:
                name: lexicon-secrets
          image: ghcr.io/syntax-engineering/lexicon_prod:20260911223944
          name: lexicon-sidekiq-ai-pit-worker
          resources:
            limits:
              cpu: 1381m
              memory: 2048Mi
            requests:
              cpu: 250m
              memory: 512Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
      imagePullSecrets:
        - name: lexicon-registry-secret
      priorityClassName: lexicon-batch
      serviceAccountName: lexicon-sidekiq-sa
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: lexicon
              priority: ai_pit
              role: worker
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
