---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lexicon
    priority: default
    role: worker
  name: lexicon-sidekiq-worker
  namespace: lexicon-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lexicon
      priority: default
      role: worker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lexicon
        priority: default
        role: worker
    spec:
      containers:
        - command:
            - bundle
            - exec
            - sidekiq
            - -q
            - high
            - -q
            - default
            - -q
            - low
            - -q
            - mailers
          envFrom:
            - configMapRef:
                name: lexicon-config
            - secretRef:
                name: lexicon-secrets
          image: ghcr.io/syntax-engineering/lexicon_prod:20260911223944
          name: lexicon-sidekiq-worker
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            limits:
              cpu: 1381m
              memory: 8192Mi
            requests:
              cpu: 500m
              memory: 4096Mi
      imagePullSecrets:
        - name: lexicon-registry-secret
      priorityClassName: lexicon-application
      serviceAccountName: lexicon-sidekiq-sa
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: lexicon
              priority: default
              role: worker
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
