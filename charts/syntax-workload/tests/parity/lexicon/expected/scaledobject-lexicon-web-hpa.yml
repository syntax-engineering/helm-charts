---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: lexicon-web-hpa
  namespace: lexicon-prod
spec:
  cooldownPeriod: 600
  fallback:
    failureThreshold: 3
    replicas: 3
  maxReplicaCount: 5
  minReplicaCount: 2
  scaleTargetRef:
    name: lexicon-web
  triggers:
    - metadata:
        query: sum(rate(http_requests_total{path!~"(/healthz|/metrics|/ahoy/events|/users/sign_in/metrics|/|/events)$"}[1m]))
        serverAddress: http://kube-prometheus-stack-lexi-prometheus.kube-prometheus-stack:9090
        threshold: "2.00"
      name: http_requests_rate
      type: prometheus
