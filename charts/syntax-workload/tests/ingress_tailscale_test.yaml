suite: Tailscale ingress
templates:
  - templates/ingress-tailscale.yaml
values:
  - values/ingress.yaml
tests:
  - it: renders a tailscale Ingress on the workload's Service port
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Ingress }
      - isAPIVersion: { of: networking.k8s.io/v1 }
      - equal: { path: metadata.name, value: acme-web-tailnet }
      - equal: { path: metadata.namespace, value: acme-env }
      - equal: { path: metadata.labels, value: { app: acme, role: web } }
      - notExists: { path: metadata.annotations }
      - equal:
          path: spec
          value:
            ingressClassName: tailscale
            defaultBackend: { service: { name: acme-web, port: { number: 8080 } } }
            tls: [{ hosts: [acme-sprint-rails] }]

  - it: copies annotations and honors serviceName
    set:
      workloads.web.serviceName: acme-svc
      workloads.web.ingress.tailnet.annotations: { tailscale.com/funnel: "true" }
    asserts:
      - equal: { path: metadata.annotations, value: { tailscale.com/funnel: "true" } }
      - equal: { path: spec.defaultBackend.service.name, value: acme-svc }

  - it: renders nothing for a disabled entry
    set: { workloads.web.ingress.tailnet.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  # Renaming the Ingress makes the operator create a new tailnet device; name keeps the old one.
  - it: names the Ingress after name when set
    set:
      workloads.web.ingress.tailnet.enabled: false
      workloads.web.ingress.private: { backend: tailscale, name: acme-web-tailnet, hostname: acme-sprint-rails }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: acme-web-tailnet }

  - it: fails when two Tailscale entries would render the same Ingress name
    set:
      workloads.web.ingress.other: { backend: tailscale, name: acme-web-tailnet, hostname: acme-other }
    asserts:
      - failedTemplate: { errorMessage: 'tailscale entries "web/other" and "web/tailnet" would both render objects named acme-web-tailnet; change name on one of them' }
