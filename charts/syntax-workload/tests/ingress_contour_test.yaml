suite: Contour ingress
templates:
  - templates/ingress-contour.yaml
values:
  - values/ingress.yaml
tests:
  - it: renders an Issuer, a Certificate, and one HTTPProxy
    asserts:
      - hasDocuments: { count: 3 }

  # Same behavior as NGF: the entry brings its own Issuer, whose solver Contour can serve.
  - it: renders an ACME Issuer that solves HTTP-01 through a contour Ingress
    documentIndex: 0
    asserts:
      - isKind: { of: Issuer }
      - isAPIVersion: { of: cert-manager.io/v1 }
      - equal: { path: metadata.name, value: acme-web-grpc-acme }
      - equal: { path: metadata.namespace, value: acme-env }
      - equal: { path: metadata.labels, value: { app: acme, role: web } }
      - equal:
          path: spec
          value:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: devops@syntaxdata.com
              privateKeySecretRef: { name: acme-web-grpc-acme-account }
              solvers:
                - http01: { ingress: { ingressClassName: contour } }

  - it: requests a certificate for every hostname from that Issuer
    documentIndex: 1
    asserts:
      - isKind: { of: Certificate }
      - isAPIVersion: { of: cert-manager.io/v1 }
      - equal: { path: metadata.name, value: acme-web-grpc }
      - equal: { path: metadata.namespace, value: acme-env }
      - equal: { path: metadata.labels, value: { app: acme, role: web, cert-manager.io/solver: contour } }
      - equal:
          path: spec
          value:
            secretName: acme-web-grpc-tls
            issuerRef: { kind: Issuer, name: acme-web-grpc-acme }
            dnsNames: [grpc.acme.example.com]

  - it: uses a ClusterIssuer instead of its own Issuer when tls.clusterIssuer is set
    set:
      workloads.web.ingress.grpc.tls: { clusterIssuer: letsencrypt-prod }
    asserts:
      - hasDocuments: { count: 2 }
      - isKind: { of: Certificate }
        documentIndex: 0
      - equal: { path: spec.issuerRef, value: { kind: ClusterIssuer, name: letsencrypt-prod } }
        documentIndex: 0

  - it: honors ACME overrides and solves through the entry's ingress class
    set:
      workloads.web.ingress.grpc:
        className: contour-internal
        tls:
          secretName: acme-gruf-tls
          acme: { email: ops@example.com, server: https://acme-staging-v02.api.letsencrypt.org/directory, waitInsteadOfSelfCheck: 30s }
    asserts:
      - equal:
          path: spec.acme
          value:
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            email: ops@example.com
            privateKeySecretRef: { name: acme-web-grpc-acme-account }
            solvers:
              - http01: { ingress: { ingressClassName: contour-internal } }
                waitInsteadOfSelfCheck: 30s
        documentIndex: 0
      - equal: { path: spec.secretName, value: acme-gruf-tls }
        documentIndex: 1
      - equal: { path: spec.virtualhost.tls.secretName, value: acme-gruf-tls }
        documentIndex: 2

  - it: serves the hostname over TLS and routes to the workload's Service
    documentIndex: 2
    asserts:
      - isKind: { of: HTTPProxy }
      - isAPIVersion: { of: projectcontour.io/v1 }
      - equal: { path: metadata.name, value: acme-web-grpc }
      - equal: { path: metadata.namespace, value: acme-env }
      - equal:
          path: spec
          value:
            virtualhost: { fqdn: grpc.acme.example.com, tls: { secretName: acme-web-grpc-tls } }
            routes:
              - conditions: [{ prefix: / }]
                services: [{ name: acme-web, port: 8080 }]

  - it: honors protocol, timeout, class, response headers, and annotations
    set:
      workloads.web.ingress.grpc:
        protocol: h2c
        timeout: 20m
        className: contour
        annotations: { team: core }
        responseHeaders: { X-Frame-Options: DENY }
    documentIndex: 2
    asserts:
      - equal: { path: metadata.annotations, value: { team: core } }
      - equal: { path: spec.ingressClassName, value: contour }
      - equal:
          path: spec.routes
          value:
            - conditions: [{ prefix: / }]
              services:
                - name: acme-web
                  port: 8080
                  protocol: h2c
                  responseHeadersPolicy: { set: [{ name: X-Frame-Options, value: DENY }] }
              timeoutPolicy: { response: 20m, idle: 20m }

  - it: renders one HTTPProxy per hostname, sharing one certificate
    set:
      workloads.web.ingress.grpc.hostnames: [grpc.acme.example.com, grpc.acme.example.org]
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: spec.dnsNames, value: [grpc.acme.example.com, grpc.acme.example.org] }
        documentIndex: 1
      - equal: { path: metadata.name, value: acme-web-grpc-grpc-acme-example-com }
        documentIndex: 2
      - equal: { path: metadata.name, value: acme-web-grpc-grpc-acme-example-org }
        documentIndex: 3
      - equal: { path: spec.virtualhost.tls.secretName, value: acme-web-grpc-tls }
        documentIndex: 3

  - it: renders nothing for a disabled entry
    set: { workloads.web.ingress.grpc.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
