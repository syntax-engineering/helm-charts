app: acme
namespace: acme-env
image: ghcr.io/example/acme:1.0.0
workloads:
  web:
    kind: Web
    port: 8080
    healthPath: /healthz
    replicas: 2
    ingress:
      public:
        backend: ngf
        hostnames: [api.acme.example.com, mcp.acme.example.com]
        paths: [{ prefix: /assets, service: acme-assets-svc, port: 80 }]
        snippets:
          http.server: ssl_ciphers HIGH:!aNULL:!MD5;
          http.server.location: proxy_read_timeout 3600s;
        clientSettings:
          body: { bufferSize: 16k, maxSize: 1g, timeout: 300s }
          keepAlive: { requests: 1000, time: 1h, minTimeout: 5s, timeout: { server: 75s, header: 60s } }
      grpc:
        backend: contour
        name: acme-gruf
        hostnames: [grpc.acme.example.com]
        paths: [{ prefix: /packs, service: acme-assets-svc, port: 80 }]
        corsPolicy:
          allowCredentials: true
          allowOrigin: ["https://acme.example.com"]
          allowMethods: [GET, POST, OPTIONS]
          allowHeaders: [content-type, x-grpc-web]
        loadBalancerPolicy: { strategy: WeightedLeastRequest }
      tailnet:
        backend: tailscale
        hostname: acme-sprint-rails
  worker:
    kind: Worker
    replicas: 2
