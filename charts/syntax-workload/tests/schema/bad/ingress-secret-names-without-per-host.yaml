app: acme
namespace: acme-env
image: ghcr.io/example/acme:1.0.0
workloads:
  web:
    kind: Web
    port: 8080
    healthPath: /healthz
    replicas: 2
    ingress:
      public:
        backend: contour
        hostnames: [a.acme.example.com]
        tls: { secretNames: { a.acme.example.com: acme-a-tls } }
