app: acme
namespace: acme-env
image: ghcr.io/example/acme:1.0.0
ingresses:
  ngf:
    gateways:
      default: { hostnames: [api.acme.example.com] }
workloads:
  web:
    kind: Web
    port: 8080
    healthPath: /healthz
    replicas: 2
    ingress:
      public: { backend: ngf, hostnames: [api.acme.example.com] }
