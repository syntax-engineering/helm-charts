app: acme
namespace: acme-env
image: ghcr.io/example/acme:1.0.0
workloads:
  web:
    kind: Web
    port: 8080
    healthPath: /healthz
    replicas: 2
    ingress:
      public:
        backend: ngf
        hostnames: [api.acme.example.com]
        paths: [{ prefix: /, service: acme-assets-svc, port: 80 }]
