app: acme
namespace: acme-env
image: ghcr.io/example/acme:1.0.0
ingresses:
  ngf:
    gateways:
      shared:
        create: false
        name: platform-gateway
        namespace: nginx-gateway
        listeners: { http: http, https: https }
        tls: { secretName: acme-tls }
workloads:
  web:
    kind: Web
    port: 8080
    healthPath: /healthz
    replicas: 2
    ingress:
      public: { backend: ngf, hostnames: [api.acme.example.com], gateway: shared }
