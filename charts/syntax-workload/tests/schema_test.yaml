suite: values schema
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/pdb.yaml
  - templates/vpa.yaml
  - templates/scaledobject.yaml
  - templates/cronjob.yaml
  - templates/hook.yaml
tests:
  # Valid values render.
  - it: accepts an autoscaled Web workload
    values: [schema/good/autoscaled-web.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: accepts a CronJob and a Hook
    values: [schema/good/cron-and-hook.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: accepts a minimal Worker
    values: [schema/good/minimal-worker.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: accepts one replica when compat.allowSingleReplica is set
    values: [schema/good/single-replica-compat.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: accepts a Web workload with probes turned off
    values: [schema/good/web-without-probes.yaml]
    asserts:
      - notFailedTemplate: {}

  # Invalid values fail with a message naming the problem.
  - it: rejects integer replicas when autoscaling is set
    values: [schema/bad/autoscaling-with-integer-replicas.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/sidekiq/replicas.: got number, want object' }

  - it: rejects an unknown Hook phase
    values: [schema/bad/bad-hook-phase.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/migrate/phase.: value must be one of .PreSync., .Sync., .PostSync.' }

  - it: rejects an unknown kind
    values: [schema/bad/bad-kind.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/web/kind.: value must be one of .Web., .Worker., .CronJob., .Hook.' }

  - it: rejects replicas on a CronJob
    values: [schema/bad/cron-with-replicas.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/nightly.: .not. failed' }

  - it: rejects an empty app name
    values: [schema/bad/missing-app.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/app.: minLength: got 0, want 1' }

  - it: rejects fewer than two replicas without the compat setting
    values: [schema/bad/single-replica.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/sidekiq/replicas/min.: minimum: got 1, want 2' }

  - it: rejects an unknown top-level field
    values: [schema/bad/unknown-top-level.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'additional properties .imagePullSecrets. not allowed' }

  - it: rejects an unknown workload field
    values: [schema/bad/unknown-workload-field.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/sidekiq.: additional properties .replica. not allowed' }

  - it: requires healthPath on a Web workload with probes
    values: [schema/bad/web-missing-health-path.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/web.: missing property .healthPath.' }

  - it: requires port on a Web workload
    values: [schema/bad/web-missing-port.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/web.: missing property .port.' }

  - it: rejects app or role inside selectorLabels
    values: [schema/bad/selector-labels-role.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'invalid propertyName .role.' }

  - it: accepts tcp probes without a healthPath
    values: [schema/good/web-tcp-probes.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: rejects http probes without a healthPath
    values: [schema/bad/web-http-probe-missing-health-path.yaml]
    asserts:
      - failedTemplate: { errorPattern: "missing property .healthPath." }

  - it: rejects portName that is all digits
    values: [schema/bad/port-name-digits.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'not.* failed' }

  - it: rejects portName with a double dash
    values: [schema/bad/port-name-double-dash.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'not.* failed' }

  - it: rejects extraPorts name that is all digits
    values: [schema/bad/extra-port-name-digits.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'not.* failed' }

  - it: rejects extraPorts name with a double dash
    values: [schema/bad/extra-port-name-double-dash.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'not.* failed' }

  - it: rejects extraPorts on a CronJob
    values: [schema/bad/cron-with-extra-ports.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'not.* failed' }

  - it: accepts a Web workload with NGF, Contour, and Tailscale ingress entries
    values: [schema/good/web-with-ingress.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: accepts a Contour entry with a certificate per hostname
    values: [schema/good/contour-per-host-tls.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: rejects ingress on a non-Web workload
    values: [schema/bad/ingress-on-worker.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/workloads/worker.: .not. failed' }

  - it: rejects an ingress entry without a backend
    values: [schema/bad/ingress-missing-backend.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'missing property .backend.' }

  - it: rejects an NGF entry without hostnames
    values: [schema/bad/ingress-ngf-missing-hostnames.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'missing property .hostnames.' }

  - it: rejects a Tailscale entry with hostnames
    values: [schema/bad/ingress-tailscale-with-hostnames.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/tailnet.: .not. failed' }

  - it: rejects path rules on a Tailscale entry
    values: [schema/bad/ingress-tailscale-with-paths.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/tailnet.: .not. failed' }

  # The default rule already sends / to the workload's Service.
  - it: rejects a path rule for /
    values: [schema/bad/ingress-path-root-prefix.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'prefix.: ./. does not match pattern' }

  - it: rejects an NGF-only field on a Contour entry
    values: [schema/bad/ingress-contour-with-ngf-field.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public.: .not. failed' }

  - it: rejects a Contour-only field on an NGF entry
    values: [schema/bad/ingress-ngf-with-contour-policy.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public.: .not. failed' }

  - it: rejects a corsPolicy without allowMethods
    values: [schema/bad/ingress-contour-cors-missing-methods.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'missing property .allowMethods.' }

  - it: rejects an unknown load balancer strategy
    values: [schema/bad/ingress-contour-bad-lb-strategy.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'strategy.: value must be one of' }

  - it: rejects an ingress entry name that is not a DNS label
    values: [schema/bad/ingress-bad-entry-name.yaml]
    asserts:
      - failedTemplate: { errorPattern: '.Public. does not match pattern' }

  - it: rejects an ingress name that is not a DNS label
    values: [schema/bad/ingress-bad-name.yaml]
    asserts:
      - failedTemplate: { errorPattern: '.Acme_Web. does not match pattern' }

  - it: rejects tls.clusterIssuer together with tls.acme
    values: [schema/bad/ingress-issuer-and-acme.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public/tls.: .not. failed' }

  - it: rejects a waitInsteadOfSelfCheck that is not a duration
    values: [schema/bad/ingress-bad-wait.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'waitInsteadOfSelfCheck.: .30 seconds. does not match pattern' }

  - it: rejects tls.secretNames without tls.perHost
    values: [schema/bad/ingress-secret-names-without-per-host.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'missing property .perHost.' }

  - it: rejects tls.secretName together with tls.perHost
    values: [schema/bad/ingress-per-host-with-secret-name.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public/tls.: .not. failed' }

  - it: rejects tls.perHost on an NGF entry
    values: [schema/bad/ingress-ngf-per-host.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public.: .not. failed' }

  - it: rejects a snippet in a context NGF does not allow
    values: [schema/bad/ingress-bad-snippet-context.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'additional properties .server. not allowed' }

  - it: rejects a client body size NGF cannot parse
    values: [schema/bad/ingress-bad-body-size.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'maxSize.: .1GB. does not match pattern' }

  - it: rejects NGF policies on a Contour entry
    values: [schema/bad/ingress-contour-with-snippets.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public.: .not. failed' }

  - it: rejects an NGF timeout that NGF cannot parse
    values: [schema/bad/ingress-ngf-bad-timeout.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingress/public/timeout.: .infinity. does not match pattern' }

  - it: accepts Exact match, a full-path rewrite, and a path rule without service and port
    values: [schema/good/web-with-path-rules.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: rejects a path match other than Exact
    values: [schema/bad/ingress-path-bad-match.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'paths/0/match.: value must be .Exact.' }

  - it: rejects a full-path rewrite that is not absolute
    values: [schema/bad/ingress-path-rewrite-relative.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'rewrite/fullPath.: .metrics. does not match pattern' }

  - it: rejects an unknown field in rewrite
    values: [schema/bad/ingress-path-rewrite-unknown-field.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'additional propert.* .prefix. not allowed' }

  # A service without its port (or the reverse) would silently mix the workload's port with another Service.
  - it: rejects a path rule with a service but no port
    values: [schema/bad/ingress-path-service-without-port.yaml]
    asserts:
      - failedTemplate: { errorPattern: "properties 'port' required, if 'service' exists" }

  - it: rejects Exact match on a Contour entry
    values: [schema/bad/ingress-contour-path-exact.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'paths/0.: .not. failed' }

  - it: rejects a rewrite on a Contour entry
    values: [schema/bad/ingress-contour-path-rewrite.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'paths/0.: .not. failed' }

  - it: accepts declared, implicit, internal, and external Gateways with ngf entries that name them
    values: [schema/good/web-with-gateways.yaml]
    asserts:
      - notFailedTemplate: {}

  - it: rejects the removed gateway object on an NGF entry
    values: [schema/bad/ingress-ngf-gateway-object.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'ingress/public/gateway.: got object, want string' }

  - it: rejects tls on an NGF entry (it moved to ingresses.ngf.gateways)
    values: [schema/bad/ingress-ngf-entry-tls.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'ingress/public.: .not. failed' }

  - it: rejects a Gateway key on a Contour entry
    values: [schema/bad/ingress-contour-with-gateway-key.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'ingress/public.: .not. failed' }

  - it: rejects a Gateway key on a Tailscale entry
    values: [schema/bad/ingress-tailscale-with-gateway-key.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'ingress/tailnet.: .not. failed' }

  - it: rejects an ingresses backend other than ngf
    values: [schema/bad/ingresses-unknown-backend.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingresses.: additional properties .contour. not allowed' }

  - it: rejects an unknown key under ingresses.ngf
    values: [schema/bad/ingresses-ngf-unknown-key.yaml]
    asserts:
      - failedTemplate: { errorPattern: '/ingresses/ngf.: additional properties .listeners. not allowed' }

  - it: rejects an unknown Gateway field
    values: [schema/bad/ingresses-gateway-unknown-field.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/default.: additional properties .hostnames. not allowed' }

  - it: rejects a Gateway key that is not a DNS label
    values: [schema/bad/ingresses-gateway-bad-key.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'invalid propertyName .Bad_Key.' }

  - it: rejects tls.clusterIssuer together with tls.acme on a Gateway
    values: [schema/bad/ingresses-gateway-issuer-and-acme.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/default/tls.: .not. failed' }

  - it: rejects an external Gateway without listeners
    values: [schema/bad/ingresses-gateway-external-without-listeners.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/shared.: missing property .listeners.' }

  - it: rejects an external Gateway without a name
    values: [schema/bad/ingresses-gateway-external-without-name.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/shared.: missing property .name.' }

  - it: rejects an external Gateway without a namespace
    values: [schema/bad/ingresses-gateway-external-without-namespace.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/shared.: missing property .namespace.' }

  - it: rejects tls on an external Gateway
    values: [schema/bad/ingresses-gateway-external-with-tls.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/shared.: .not. failed' }

  - it: rejects className on an external Gateway
    values: [schema/bad/ingresses-gateway-external-with-class-name.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/shared.: .not. failed' }

  - it: rejects annotations on an external Gateway
    values: [schema/bad/ingresses-gateway-external-with-annotations.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/shared.: .not. failed' }

  - it: rejects listeners on a Gateway the chart creates
    values: [schema/bad/ingresses-gateway-created-with-listeners.yaml]
    asserts:
      - failedTemplate: { errorPattern: 'gateways/default.: .not. failed' }
