suite: Web kind
values:
  - values/web.yaml
tests:
  - it: exposes a named http port
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].ports'
          value: [{ containerPort: 8080, name: http, protocol: TCP }]

  - it: exposes a bare containerPort in compatibility mode
    template: templates/deployment.yaml
    set: { workloads.web.compat.bareContainerPort: true }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].ports', value: [{ containerPort: 8080 }] }

  - it: adds startup, readiness, and liveness probes on the health path
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].startupProbe'
          value: { httpGet: { path: /healthz, port: 8080, scheme: HTTP }, failureThreshold: 60, periodSeconds: 5, timeoutSeconds: 3 }
      - equal:
          path: 'spec.template.spec.containers[0].readinessProbe'
          value: { httpGet: { path: /healthz, port: 8080, scheme: HTTP }, failureThreshold: 2, periodSeconds: 3, successThreshold: 1, timeoutSeconds: 1 }
      - equal:
          path: 'spec.template.spec.containers[0].livenessProbe'
          value: { httpGet: { path: /healthz, port: 8080, scheme: HTTP }, failureThreshold: 6, periodSeconds: 10, timeoutSeconds: 5 }

  - it: merges probe overrides over the defaults and drops a probe set to false
    template: templates/deployment.yaml
    set:
      workloads.web.probes.readiness: { initialDelaySeconds: 15 }
      workloads.web.probes.startup: false
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.initialDelaySeconds', value: 15 }
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.periodSeconds', value: 3 }
      - notExists: { path: 'spec.template.spec.containers[0].startupProbe' }

  - it: drops all probes when probes is false
    template: templates/deployment.yaml
    set: { workloads.web.probes: false }
    asserts:
      - notExists: { path: 'spec.template.spec.containers[0].startupProbe' }
      - notExists: { path: 'spec.template.spec.containers[0].readinessProbe' }
      - notExists: { path: 'spec.template.spec.containers[0].livenessProbe' }

  - it: renders a Service that targets the named port
    template: templates/service.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: acme-web }
      - notExists: { path: spec.type }
      - equal: { path: spec.selector, value: { app: acme, role: web } }
      - equal: { path: spec.ports, value: [{ name: http, port: 8080, protocol: TCP, targetPort: http }] }

  - it: honors serviceName, serviceType, and the bare port compatibility mode
    template: templates/service.yaml
    set:
      workloads.web.serviceName: acme-svc
      workloads.web.serviceType: NodePort
      workloads.web.compat.bareContainerPort: true
    asserts:
      - equal: { path: metadata.name, value: acme-svc }
      - equal: { path: spec.type, value: NodePort }
      - equal: { path: spec.ports, value: [{ name: http, port: 8080, targetPort: 8080 }] }

  - it: gets a PDB, VPA, and ScaledObject like a Worker
    templates: [templates/pdb.yaml, templates/vpa.yaml, templates/scaledobject.yaml]
    asserts:
      - hasDocuments: { count: 1 }

  - it: supports several Web workloads side by side
    template: templates/service.yaml
    set:
      workloads.mcp: { kind: Web, port: 3000, healthPath: /up, replicas: 2 }
    asserts:
      - hasDocuments: { count: 2 }

  # Review Focus: an environment that turns a workload off renders none of its objects.
  - it: renders no objects at all for a disabled Web workload
    templates:
      - templates/deployment.yaml
      - templates/service.yaml
      - templates/pdb.yaml
      - templates/vpa.yaml
      - templates/scaledobject.yaml
    set: { workloads.web.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: merges selectorLabels into the Service selector
    template: templates/service.yaml
    set: { workloads.web.selectorLabels: { tier: frontend } }
    asserts:
      - equal: { path: spec.selector, value: { app: acme, role: web, tier: frontend } }

  - it: labels the Service with its selector
    template: templates/service.yaml
    set: { workloads.web.selectorLabels: { tier: frontend } }
    asserts:
      - equal: { path: metadata.labels, value: { app: acme, role: web, tier: frontend } }

  - it: passes volumes and volumeMounts through
    template: templates/deployment.yaml
    set:
      workloads.web.volumes: [{ name: nginx-config, configMap: { name: acme-nginx } }]
      workloads.web.volumeMounts: [{ name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }]
    asserts:
      - equal: { path: spec.template.spec.volumes, value: [{ name: nginx-config, configMap: { name: acme-nginx } }] }
      - equal:
          path: "spec.template.spec.containers[0].volumeMounts"
          value: [{ name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }]

  - it: names the port and Service port with portName
    template: templates/deployment.yaml
    set: { workloads.web.portName: grpc }
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].ports'
          value: [{ containerPort: 8080, name: grpc, protocol: TCP }]

  - it: targets portName from the Service
    template: templates/service.yaml
    set: { workloads.web.portName: grpc }
    asserts:
      - equal:
          path: spec.ports
          value: [{ name: grpc, port: 8080, protocol: TCP, targetPort: grpc }]

  - it: uses tcpSocket on the named port when probeType is tcp
    template: templates/deployment.yaml
    set: { workloads.web.probeType: tcp, workloads.web.portName: mcp }
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].livenessProbe'
          value: { tcpSocket: { port: mcp }, failureThreshold: 6, periodSeconds: 10, timeoutSeconds: 5 }

  - it: uses the port number for tcp probes when the port is bare
    template: templates/deployment.yaml
    set: { workloads.web.probeType: tcp, workloads.web.compat.bareContainerPort: true }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.tcpSocket', value: { port: 8080 } }

  - it: uses a grpc handler on the port number when probeType is grpc
    template: templates/deployment.yaml
    set: { workloads.web.probeType: grpc }
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].startupProbe'
          value: { grpc: { port: 8080 }, failureThreshold: 60, periodSeconds: 5, timeoutSeconds: 3 }
      - notExists: { path: 'spec.template.spec.containers[0].startupProbe.httpGet' }

  - it: adds extra container ports after the main port
    template: templates/deployment.yaml
    set: { workloads.web.extraPorts: [{ name: metrics, port: 9095 }] }
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].ports'
          value:
            - { containerPort: 8080, name: http, protocol: TCP }
            - { containerPort: 9095, name: metrics, protocol: TCP }

  - it: does not expose extra ports on the Service
    template: templates/service.yaml
    set: { workloads.web.extraPorts: [{ name: metrics, port: 9095 }] }
    asserts:
      - lengthEqual: { path: spec.ports, count: 1 }

  - it: fails when an extra port reuses the main port name
    template: templates/deployment.yaml
    set: { workloads.web.extraPorts: [{ name: http, port: 9095 }] }
    asserts:
      - failedTemplate: { errorPattern: "reuses the port name" }

  - it: annotates the Service
    template: templates/service.yaml
    set: { workloads.web.serviceAnnotations: { projectcontour.io/upstream-protocol.h2c: "8080" } }
    asserts:
      - equal: { path: metadata.annotations, value: { projectcontour.io/upstream-protocol.h2c: "8080" } }
