suite: Web kind
values:
  - values/web.yaml
tests:
  - it: exposes a named http port
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].ports'
          value: [{ containerPort: 8080, name: http, protocol: TCP }]

  - it: exposes a bare containerPort in compatibility mode
    template: templates/deployment.yaml
    set: { workloads.web.compat.bareContainerPort: true }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].ports', value: [{ containerPort: 8080 }] }

  - it: adds startup, readiness, and liveness probes on the health path
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].startupProbe'
          value: { httpGet: { path: /healthz, port: 8080, scheme: HTTP }, failureThreshold: 60, periodSeconds: 5, timeoutSeconds: 3 }
      - equal:
          path: 'spec.template.spec.containers[0].readinessProbe'
          value: { httpGet: { path: /healthz, port: 8080, scheme: HTTP }, failureThreshold: 2, periodSeconds: 3, successThreshold: 1, timeoutSeconds: 1 }
      - equal:
          path: 'spec.template.spec.containers[0].livenessProbe'
          value: { httpGet: { path: /healthz, port: 8080, scheme: HTTP }, failureThreshold: 6, periodSeconds: 10, timeoutSeconds: 5 }

  - it: merges probe overrides over the defaults and drops a probe set to false
    template: templates/deployment.yaml
    set:
      workloads.web.probes.readiness: { initialDelaySeconds: 15 }
      workloads.web.probes.startup: false
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.initialDelaySeconds', value: 15 }
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.periodSeconds', value: 3 }
      - notExists: { path: 'spec.template.spec.containers[0].startupProbe' }

  - it: drops all probes when probes is false
    template: templates/deployment.yaml
    set: { workloads.web.probes: false }
    asserts:
      - notExists: { path: 'spec.template.spec.containers[0].startupProbe' }
      - notExists: { path: 'spec.template.spec.containers[0].readinessProbe' }
      - notExists: { path: 'spec.template.spec.containers[0].livenessProbe' }

  - it: renders a Service that targets the named port
    template: templates/service.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: acme-web }
      - notExists: { path: spec.type }
      - equal: { path: spec.selector, value: { app: acme, role: web } }
      - equal: { path: spec.ports, value: [{ name: http, port: 8080, protocol: TCP, targetPort: http }] }

  - it: honors serviceName, serviceType, and the bare port compatibility mode
    template: templates/service.yaml
    set:
      workloads.web.serviceName: acme-svc
      workloads.web.serviceType: NodePort
      workloads.web.compat.bareContainerPort: true
    asserts:
      - equal: { path: metadata.name, value: acme-svc }
      - equal: { path: spec.type, value: NodePort }
      - equal: { path: spec.ports, value: [{ name: http, port: 8080, targetPort: 8080 }] }

  - it: gets a PDB, VPA, and ScaledObject like a Worker
    templates: [templates/pdb.yaml, templates/vpa.yaml, templates/scaledobject.yaml]
    asserts:
      - hasDocuments: { count: 1 }

  - it: supports several Web workloads side by side
    template: templates/service.yaml
    set:
      workloads.mcp: { kind: Web, port: 3000, healthPath: /up, replicas: 2 }
    asserts:
      - hasDocuments: { count: 2 }

  # Review Focus: an environment that turns a workload off renders none of its objects.
  - it: renders no objects at all for a disabled Web workload
    templates:
      - templates/deployment.yaml
      - templates/service.yaml
      - templates/pdb.yaml
      - templates/vpa.yaml
      - templates/scaledobject.yaml
    set: { workloads.web.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: merges selectorLabels into the Service selector
    template: templates/service.yaml
    set: { workloads.web.selectorLabels: { tier: frontend } }
    asserts:
      - equal: { path: spec.selector, value: { app: acme, role: web, tier: frontend } }
