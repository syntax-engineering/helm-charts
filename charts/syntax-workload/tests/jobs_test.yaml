suite: CronJob and Hook kinds
values:
  - values/jobs.yaml
tests:
  - it: renders a CronJob with guardrails
    template: templates/cronjob.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: acme-nightly }
      - equal: { path: spec.schedule, value: "0 3 * * *" }
      - equal: { path: spec.concurrencyPolicy, value: Forbid }
      - equal: { path: spec.successfulJobsHistoryLimit, value: 3 }
      - equal: { path: spec.failedJobsHistoryLimit, value: 3 }
      - equal: { path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 3600 }
      - equal: { path: spec.jobTemplate.spec.template.metadata.labels, value: { app: acme, role: nightly } }
      - equal: { path: spec.jobTemplate.spec.template.spec.restartPolicy, value: Never }
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].command", value: [bundle, exec, rake, nightly] }
      - equal:
          path: "spec.jobTemplate.spec.template.spec.containers[0].resources"
          value: { requests: { cpu: 1000m, memory: 2Gi }, limits: { cpu: 2000m, memory: 4Gi } }

  - it: drops any CronJob guardrail set to false and supports timeZone
    template: templates/cronjob.yaml
    set:
      workloads.nightly.concurrencyPolicy: false
      workloads.nightly.activeDeadlineSeconds: false
      workloads.nightly.successfulJobsHistoryLimit: false
      workloads.nightly.failedJobsHistoryLimit: false
      workloads.nightly.timeZone: America/New_York
    asserts:
      - notExists: { path: spec.concurrencyPolicy }
      - notExists: { path: spec.successfulJobsHistoryLimit }
      - notExists: { path: spec.failedJobsHistoryLimit }
      - notExists: { path: spec.jobTemplate.spec.activeDeadlineSeconds }
      - equal: { path: spec.timeZone, value: America/New_York }

  - it: supports several CronJobs
    template: templates/cronjob.yaml
    set:
      workloads.weekly: { kind: CronJob, schedule: "0 4 * * 0", command: [rake, weekly] }
    asserts:
      - hasDocuments: { count: 2 }

  - it: renders a PreSync hook Job with Argo CD annotations
    template: templates/hook.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Job }
      - equal: { path: metadata.name, value: acme-migrate-db }
      - equal:
          path: metadata.annotations
          value: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation }
      - equal: { path: spec.backoffLimit, value: 0 }
      - equal: { path: spec.activeDeadlineSeconds, value: 1800 }
      - notExists: { path: spec.template.metadata }
      - equal: { path: spec.template.spec.restartPolicy, value: Never }
      - equal: { path: spec.template.spec.imagePullSecrets, value: [{ name: acme-registry }] }

  - it: supports the hook compatibility settings
    template: templates/hook.yaml
    set:
      workloads.migrate-db.containerName: migrate
      workloads.migrate-db.resources: false
      workloads.migrate-db.activeDeadlineSeconds: false
    asserts:
      - equal: { path: "spec.template.spec.containers[0].name", value: migrate }
      - notExists: { path: "spec.template.spec.containers[0].resources" }
      - notExists: { path: spec.activeDeadlineSeconds }

  - it: renders no Job objects for disabled job workloads
    templates: [templates/cronjob.yaml, templates/hook.yaml]
    set: { workloads.nightly.enabled: false, workloads.migrate-db.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: applies the app-wide priority class to CronJob pods
    template: templates/cronjob.yaml
    set: { priorityClassName: acme-batch }
    asserts:
      - equal: { path: spec.jobTemplate.spec.template.spec.priorityClassName, value: acme-batch }

  - it: omits the priority class on a hook that sets it to false
    template: templates/hook.yaml
    set: { priorityClassName: acme-batch, workloads.migrate-db.priorityClassName: false }
    asserts:
      - notExists: { path: spec.template.spec.priorityClassName }
