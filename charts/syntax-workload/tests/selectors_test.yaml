suite: selector uniqueness
values:
  - values/worker.yaml
templates:
  - templates/deployment.yaml
  - templates/cronjob.yaml
tests:
  - it: allows workers that share a role but differ in selectorLabels
    set:
      workloads.sidekiq.role: worker
      workloads.sidekiq.selectorLabels: { priority: default }
      workloads.xlow: { kind: Worker, role: worker, selectorLabels: { priority: xlow }, command: [sidekiq], replicas: 2 }
    asserts:
      - notFailedTemplate: {}

  - it: rejects two workers with the same full selector
    template: templates/deployment.yaml
    set:
      workloads.sidekiq.role: worker
      workloads.xlow: { kind: Worker, role: worker, command: [sidekiq], replicas: 2 }
    asserts:
      - failedTemplate: { errorPattern: 'have the same selector' }

  - it: ignores a disabled workload when checking selectors
    set:
      workloads.sidekiq.role: worker
      workloads.xlow: { kind: Worker, role: worker, command: [sidekiq], replicas: 2, enabled: false }
    asserts:
      - notFailedTemplate: {}

  - it: allows CronJobs that share a role
    set:
      workloads.a: { kind: CronJob, role: cron-job, schedule: "0 1 * * *", command: [rake, a] }
      workloads.b: { kind: CronJob, role: cron-job, schedule: "0 2 * * *", command: [rake, b] }
    asserts:
      - notFailedTemplate: {}
